<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络节点连通性测速 - 电气创新协会</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ================= 基础重置 ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b1320; color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.6; padding-bottom: 60px;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* ================= 导航栏 ================= */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background-color: rgba(11, 19, 32, 0.85);
            backdrop-filter: blur(10px); position: fixed; width: 100%; top: 0; left: 0;
            z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo { font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; }
        .logo img { width: 40px; height: 40px; object-fit: contain; }
        .btn-back {
            background: rgba(255, 255, 255, 0.05); color: #a0aec0;
            padding: 8px 24px; border-radius: 20px; text-decoration: none; font-size: 14px;
            border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s;
        }
        .btn-back:hover { background: rgba(0, 210, 255, 0.1); color: #00d2ff; }

        /* ================= 页面布局 ================= */
        .page-header { text-align: center; padding: 120px 5% 30px; }
        .page-header h1 { font-size: 2.5rem; font-weight: 800; color: #ffffff; margin-bottom: 10px; }
        .page-header p { color: #a0aec0; font-size: 1rem; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        /* ================= 控制区 (输入框) ================= */
        .controls {
            display: flex; gap: 10px; margin-bottom: 30px;
            background: rgba(255,255,255,0.02); padding: 20px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .controls input {
            flex: 1; padding: 12px 20px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3);
            color: #fff; font-size: 15px; outline: none; transition: border 0.3s;
        }
        .controls input:focus { border-color: #00d2ff; }
        .controls button {
            padding: 0 30px; border-radius: 8px; border: none; cursor: pointer;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5); color: #fff; font-weight: bold; font-size: 15px;
            transition: opacity 0.3s;
        }
        .controls button:hover { opacity: 0.8; }

        /* ================= 预设网站网格 ================= */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 50px; }
        
        .site-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px; padding: 20px; display: flex; flex-direction: column;
            transition: all 0.3s; position: relative; overflow: hidden;
        }
        .site-card:hover { border-color: rgba(0,210,255,0.3); transform: translateY(-2px); }
        
        .site-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; }
        .site-icon {
            width: 40px; height: 40px; border-radius: 8px; background: rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: center; font-size: 20px; color: #a0aec0;
            overflow: hidden;
        }
        .site-icon img { width: 24px; height: 24px; object-fit: contain; }
        .site-title { flex: 1; font-size: 1.1rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .site-data { display: flex; justify-content: space-between; font-size: 14px; margin-top: 5px; }
        .data-item { display: flex; flex-direction: column; align-items: center; }
        .data-label { color: #718096; font-size: 12px; margin-bottom: 4px; }
        .data-value { font-weight: bold; font-family: monospace; font-size: 16px; }
        
        .val-pending { color: #718096; }
        .val-good { color: #00ffaa; }
        .val-medium { color: #ff9632; }
        .val-bad { color: #ff4d4d; }

        /* ================= 折线图区域 ================= */
        .chart-section {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px; padding: 30px; position: relative;
        }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .chart-header h2 { font-size: 1.4rem; color: #fff; }
        
        /* 图例 */
        .legend { display: flex; flex-wrap: wrap; gap: 15px; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #a0aec0; }
        .legend-color { width: 10px; height: 10px; border-radius: 50%; }

        .canvas-wrapper { width: 100%; height: 300px; position: relative; }
        canvas { width: 100%; height: 100%; display: block; }
        
        @media (max-width: 600px) {
            .controls { flex-direction: column; }
            .controls button { padding: 12px; }
            .page-header h1 { font-size: 2rem; }
            .chart-header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <img src="../images/logo.png" alt="Logo">
            电气创新协会
        </a>
        <a href="index.html" class="btn-back">返回首页</a>
    </header>

    <section class="page-header">
        <h1>节点连通性测速</h1>
        <p>实时监测网络请求耗时与波动趋势 (注: 受浏览器跨域策略影响，数据仅供参考)</p>
    </section>

    <main class="container">
        <!-- 添加自定义网站 -->
        <div class="controls">
            <input type="url" id="customUrl" placeholder="输入要测速的网址 (例如: https://www.example.com)">
            <button id="addBtn"><i class="fas fa-plus"></i> 添加并测速</button>
        </div>

        <!-- 网站卡片网格 -->
        <div class="grid-container" id="gridContainer">
            <!-- 卡片将由 JS 动态生成 -->
        </div>

        <!-- 实时波动折线图 -->
        <div class="chart-section">
            <div class="chart-header">
                <h2><i class="fas fa-chart-line" style="color: #00d2ff;"></i> 实时延迟波动率</h2>
                <div class="legend" id="chartLegend"></div>
            </div>
            <div class="canvas-wrapper">
                <canvas id="speedChart"></canvas>
            </div>
        </div>
    </main>

    <script>
        // 预设网站列表 (包含名称、网址、图标类名或favicon接口)
        const defaultSites = [
            { name: "青岛滨海学院", url: "https://qdbhu.edu.cn/", icon: "fa-university" },
            { name: "工信部", url: "https://wap.miit.gov.cn/", icon: "fa-landmark" },
            { name: "清华镜像源", url: "https://mirrors.tuna.tsinghua.edu.cn/", icon: "fa-server" },
            { name: "中科大镜像源", url: "https://mirrors.ustc.edu.cn/", icon: "fa-server" },
            { name: "东京大学图书馆", url: "https://www.lib.u-tokyo.ac.jp/ja", icon: "fa-book" },
            { name: "MIT图书馆", url: "https://libraries.mit.edu/", icon: "fa-book-open" },
            { name: "首尔大学图书馆", url: "https://en.snu.ac.kr/academics/students/library", icon: "fa-book-reader" },
            { name: "GitHub", url: "https://github.com/", icon: "fa-brands fa-github" },
            { name: "Siemens", url: "https://www.siemens.com/de-de/", icon: "fa-industry" },
            { name: "Google", url: "https://www.google.com", icon: "fa-brands fa-google" },
            { name: "超星学习通", url: "https://v8.chaoxing.com/", icon: "fa-graduation-cap" }
        ];

        // 图表颜色盘
        const colors = ['#00d2ff', '#00ffaa', '#ff9632', '#b464ff', '#ff4d4d', '#ffeb3b', '#ff00ff', '#00bcd4', '#8bc34a', '#ff5722', '#9e9e9e'];

        // 全局状态
        let sites = [...defaultSites];
        let chartData = []; // 存储历史数据 [{time, site1: 50, site2: 100...}]
        let chartCtx = document.getElementById('speedChart').getContext('2d');

        // 初始化渲染卡片
        function renderCards() {
            const grid = document.getElementById('gridContainer');
            grid.innerHTML = '';
            
            sites.forEach((site, index) => {
                // 尝试获取网站 favicon
                const domain = new URL(site.url).hostname;
                const faviconUrl = `https://api.iowen.cn/favicon/${domain}.png`; // 使用第三方接口抓取图标，若失败用内置字体图标兜底
                const color = colors[index % colors.length];

                const card = document.createElement('div');
                card.className = 'site-card';
                card.innerHTML = `
                    <div class="site-header">
                        <div class="site-icon" style="border: 1px solid ${color}40;">
                            <img src="${faviconUrl}" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fas ${site.icon}\\' style=\\'color:${color}\\'></i>';">
                        </div>
                        <div class="site-title" title="${site.name}">${site.name}</div>
                    </div>
                    <div class="site-data">
                        <div class="data-item">
                            <span class="data-label">延迟 (ms)</span>
                            <span class="data-value val-pending" id="lat-${index}">--</span>
                        </div>
                        <div class="data-item">
                            <span class="data-label">丢包率</span>
                            <span class="data-value val-pending" id="loss-${index}">--</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 生成图例
        function renderLegend() {
            const legend = document.getElementById('chartLegend');
            legend.innerHTML = '';
            sites.forEach((site, index) => {
                const color = colors[index % colors.length];
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `<div class="legend-color" style="background:${color}"></div> ${site.name}`;
                legend.appendChild(item);
            });
        }

        // 核心测试逻辑
        async function pingSite(url) {
            return new Promise((resolve) => {
                const start = performance.now();
                // 加上随机参数防止缓存
                const testUrl = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
                
                // 使用 no-cors 模式，我们只关心请求发出的耗时，不读取内容
                fetch(testUrl, { mode: 'no-cors', cache: 'no-store' })
                    .then(() => {
                        const duration = performance.now() - start;
                        // no-cors 模式下返回的是 opaque response，只要能进 then 就算连通
                        resolve({ success: true, time: duration });
                    })
                    .catch(() => {
                        resolve({ success: false, time: 0 });
                    });
                
                // 设置超时，防止卡死
                setTimeout(() => resolve({ success: false, time: 5000 }), 5000);
            });
        }

        // 执行所有测试
        async function runTests() {
            const currentTime = new Date().toLocaleTimeString();
            let dataPoint = { time: currentTime };

            for (let i = 0; i < sites.length; i++) {
                const site = sites[i];
                const latEl = document.getElementById(`lat-${i}`);
                const lossEl = document.getElementById(`loss-${i}`);
                
                if(latEl && lossEl) {
                    latEl.className = 'data-value val-pending';
                    latEl.innerText = '测速中...';
                }

                const res = await pingSite(site.url);
                
                if (latEl && lossEl) {
                    if (res.success) {
                        const ms = Math.round(res.time);
                        latEl.innerText = ms;
                        // 根据延迟设定颜色
                        latEl.className = `data-value ${ms < 300 ? 'val-good' : ms < 800 ? 'val-medium' : 'val-bad'}`;
                        
                        // 模拟丢包率（单次请求只要能回来就算 0%，超时算 100%）
                        lossEl.innerText = '0%';
                        lossEl.className = 'data-value val-good';
                        
                        // 记录数据给图表
                        dataPoint[`site_${i}`] = ms;
                    } else {
                        latEl.innerText = '超时';
                        latEl.className = 'data-value val-bad';
                        lossEl.innerText = '100%';
                        lossEl.className = 'data-value val-bad';
                        dataPoint[`site_${i}`] = 1000; // 图表上超时给个固定高值
                    }
                }
            }

            // 保存历史数据，最多保留 30 个点
            chartData.push(dataPoint);
            if (chartData.length > 30) chartData.shift();
            
            drawChart();
        }

        // 绘制折线图
        function drawChart() {
            const canvas = document.getElementById('speedChart');
            const rect = canvas.parentElement.getBoundingClientRect();
            // 适配高清屏
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            chartCtx.scale(dpr, dpr);
            
            const w = rect.width;
            const h = rect.height;
            const pad = 40; // 边距

            chartCtx.clearRect(0, 0, w, h);

            if (chartData.length < 2) return;

            // 绘制背景网格
            chartCtx.strokeStyle = 'rgba(255,255,255,0.05)';
            chartCtx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = pad + (h - pad * 2) * (i / 4);
                chartCtx.beginPath();
                chartCtx.moveTo(pad, y);
                chartCtx.lineTo(w - pad, y);
                chartCtx.stroke();
            }

            // 计算最大延迟，用于 Y 轴比例
            let maxVal = 1000; 

            // 绘制每一条线
            sites.forEach((site, siteIndex) => {
                const color = colors[siteIndex % colors.length];
                chartCtx.strokeStyle = color;
                chartCtx.lineWidth = 2;
                chartCtx.beginPath();

                chartData.forEach((point, i) => {
                    const val = point[`site_${siteIndex}`] || 0;
                    const x = pad + (w - pad * 2) * (i / (chartData.length - 1));
                    const y = h - pad - ((h - pad * 2) * (val / maxVal));
                    
                    if (i === 0) chartCtx.moveTo(x, y);
                    else chartCtx.lineTo(x, y);
                });
                chartCtx.stroke();
            });
            
            // 绘制X轴时间
            chartCtx.fillStyle = '#718096';
            chartCtx.font = '12px monospace';
            chartCtx.textAlign = 'center';
            chartCtx.fillText(chartData[0].time, pad, h - 10);
            chartCtx.fillText(chartData[chartData.length-1].time, w - pad, h - 10);
        }

        // 添加自定义网站
        document.getElementById('addBtn').addEventListener('click', () => {
            let url = document.getElementById('customUrl').value.trim();
            if (!url) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            
            // 简单校验
            try { new URL(url); } catch(e) { alert('请输入有效的网址格式'); return; }

            const domain = new URL(url).hostname;
            // 简单从域名截取名字
            const name = domain.replace('www.', '').split('.')[0].toUpperCase();

            sites.push({ name: name, url: url, icon: "fa-globe" });
            
            // 重置并重新渲染
            document.getElementById('customUrl').value = '';
            renderCards();
            renderLegend();
        });

        // 初始化并启动循环
        renderCards();
        renderLegend();
        
        // 第一次立即执行，之后每 2 秒执行一次
        runTests();
        setInterval(runTests, 2000);

        // 窗口调整时重绘
        window.addEventListener('resize', drawChart);

    </script>
</body>
</html>
