<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告动态 - 电气创新协会</title>
    <style>
        /* ================= 基础重置 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", STHeiti, "Microsoft Yahei", Tahoma, Simsun, sans-serif;
        }

        body {
            background-color: #0b1320;
            color: #e2e8f0;
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            padding-bottom: 60px;
        }

        /* ================= 导航栏 ================= */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: rgba(11, 19, 32, 0.85);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            text-decoration: none;
        }
        
        .logo svg {
            width: 24px;
            height: 24px;
            stroke: #00d2ff;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            color: #a0aec0;
            padding: 8px 24px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .btn-back:hover {
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
            border-color: rgba(0, 210, 255, 0.3);
        }

        /* ================= 页面头部 ================= */
        .page-header {
            padding: 140px 5% 40px;
            text-align: center;
            position: relative;
        }

        .page-header h1 {
            font-size: 3rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .page-header p {
            color: #a0aec0;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .glow-bg {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 200px;
            background: #00d2ff;
            filter: blur(120px);
            opacity: 0.15;
            border-radius: 50%;
            z-index: -1;
        }

        /* ================= 数据加载与容器 ================= */
        .notice-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 5%;
            min-height: 400px; 
        }

        .loading-state {
            text-align: center;
            color: #00d2ff;
            font-size: 16px;
            padding: 50px 0;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .empty-state {
            text-align: center;
            color: #718096;
            padding: 50px 0;
            font-size: 15px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            border: 1px dashed rgba(255,255,255,0.1);
        }

        /* --- 置顶公告大卡片 --- */
        .featured-notice {
            background: linear-gradient(145deg, rgba(0, 210, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 16px;
            padding: 40px;
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none; 
            color: #e2e8f0;
        }

        .featured-notice:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 210, 255, 0.08);
            border-color: rgba(0, 210, 255, 0.4);
        }

        /* 失效状态的置顶卡片 */
        .featured-notice.expired {
            opacity: 0.6;
            filter: grayscale(80%);
        }

        .featured-glow {
            position: absolute;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: #00d2ff;
            filter: blur(80px);
            opacity: 0.3;
            border-radius: 50%;
            pointer-events: none;
        }

        .badge-top {
            display: inline-block;
            background: rgba(0, 255, 170, 0.15);
            color: #00ffaa;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
            align-self: flex-start;
            border: 1px solid rgba(0, 255, 170, 0.3);
        }

        .featured-notice h2 {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 15px;
            z-index: 2;
        }

        .featured-notice p {
            color: #a0aec0;
            font-size: 15px;
            margin-bottom: 25px;
            z-index: 2;
        }

        .meta-info {
            display: flex;
            gap: 25px;
            color: #718096;
            font-size: 13px;
            margin-bottom: 10px;
            z-index: 2;
            align-items: center;
            flex-wrap: wrap;
        }

        /* --- 常规公告列表 --- */
        .notice-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .list-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 20px 25px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s;
        }

        .list-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(0, 210, 255, 0.3);
            transform: translateX(5px);
        }

        /* 失效状态的列表项 */
        .list-item.expired {
            opacity: 0.55;
            filter: grayscale(50%);
        }

        .date-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding-right: 20px;
            margin-right: 20px;
        }

        .date-day {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            line-height: 1;
        }

        .date-ym {
            font-size: 12px;
            color: #718096;
            margin-top: 4px;
        }

        .content-box {
            flex: 1;
            min-width: 0;
        }

        .content-box h3 {
            color: #e2e8f0;
            font-size: 1.1rem;
            margin-bottom: 6px;
            font-weight: 500;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .list-item:hover .content-box h3 {
            color: #00d2ff;
        }

        .content-box p {
            color: #718096;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 600px;
        }

        .action-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: 15px;
        }

        .tag-label {
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
        }
        
        .tag-label.blue { background: rgba(0, 210, 255, 0.1); color: #00d2ff; }
        .tag-label.green { background: rgba(0, 255, 170, 0.1); color: #00ffaa; }
        .tag-label.orange { background: rgba(255, 150, 50, 0.1); color: #ff9632; }
        
        /* 新增：失效标签 */
        .tag-expired {
            background: rgba(255, 255, 255, 0.1);
            color: #a0aec0;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            white-space: nowrap;
        }

        .arrow-icon {
            color: #4a5568;
            font-size: 18px;
            transition: all 0.3s;
        }

        .list-item:hover .arrow-icon {
            color: #00d2ff;
            transform: translateX(5px);
        }

        /* 自动刷新提示 */
        .refresh-toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 210, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 210, 255, 0.3);
            color: #00d2ff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
            pointer-events: none;
            z-index: 999;
        }
        .refresh-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .page-header h1 { font-size: 2.2rem; }
            .list-item { flex-direction: column; align-items: flex-start; gap: 12px; padding: 20px; }
            .date-box { border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-right: 0; padding-bottom: 8px; margin-right: 0; flex-direction: row; gap: 10px; align-items: baseline; }
            .action-box { width: 100%; justify-content: space-between; margin-left: 0; }
            .content-box p { white-space: normal; }
            .content-box h3 { flex-direction: column; align-items: flex-start; gap: 4px; }
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <header>
        <a href="index.html" class="logo">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"></path></svg>
            电气创新协会
        </a>
        <a href="index.html" class="btn-back">返回首页</a>
    </header>

    <!-- 页头 -->
    <section class="page-header">
        <div class="glow-bg"></div>
        <h1>公告动态</h1>
        <p>发布协会最新赛事通知、招新信息与内部活动安排</p>
    </section>

    <!-- 公告渲染容器 -->
    <div class="notice-container" id="notice-container">
        <div class="loading-state" id="loading">加载数据中...</div>
    </div>

    <!-- 自动刷新提示 -->
    <div class="refresh-toast" id="refreshToast">✨ 公告已自动更新</div>

    <!-- 核心渲染逻辑 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('notice-container');
            const loading = document.getElementById('loading');
            const toast = document.getElementById('refreshToast');
            let isFirstLoad = true;

            // 提取 P* 里的数字用于排序
            function getIdNumber(idStr) {
                if (!idStr) return 0;
                const match = String(idStr).match(/\d+/);
                return match ? parseInt(match[0], 10) : 0;
            }

            // 提取数据并渲染的函数
            async function fetchAndRender() {
                try {
                    // 添加时间戳防止浏览器缓存
                    const response = await fetch(`./notices.json?t=${Date.now()}`);
                    if (!response.ok) throw new Error('网络请求错误');
                    
                    const data = await response.json();
                    
                    if (!data || data.length === 0) {
                        container.innerHTML = '<div class="empty-state">暂无公告发布</div>';
                        return;
                    }

                    // 1. 区分置顶和非置顶
                    let topNotice = data.find(item => item.isTop === true);
                    let normalNotices = data.filter(item => item.isTop !== true);

                    // 2. 对非置顶公告按照 P* 数字降序排列 (数字大的在前面)
                    normalNotices.sort((a, b) => getIdNumber(b.id) - getIdNumber(a.id));

                    let html = '';

                    // ================= 渲染置顶卡片 =================
                    if (topNotice) {
                        const topLink = topNotice.link ? topNotice.link : '#'; 
                        const isExpired = topNotice.isExpired === true;
                        const expiredClass = isExpired ? 'expired' : '';
                        const expiredTag = isExpired ? `<span class="tag-expired" style="margin-left:10px;">已失效</span>` : '';
                        
                        html += `
                            <a href="${topLink}" class="featured-notice ${expiredClass}">
                                <div class="featured-glow"></div>
                                <div class="badge-top">🔥 ${topNotice.tag || '置顶公告'}</div>
                                <h2>${topNotice.title} ${expiredTag}</h2>
                                <p>${topNotice.desc}</p>
                                <div class="meta-info">
                                    <span>📅 ${topNotice.date}</span>
                                    <span>📍 ${topNotice.location || '校内'}</span>
                                </div>
                            </a>
                        `;
                    }

                    // ================= 渲染普通列表 =================
                    if (normalNotices.length > 0) {
                        html += `<div class="notice-list">`;
                        normalNotices.forEach(item => {
                            // 兼容处理日期切割
                            const dateParts = item.date ? item.date.split('-') : ['0000', '00', '00']; 
                            const yearMonth = `${dateParts[0]}.${dateParts[1]}`;
                            const day = dateParts[2];
                            const tagClass = item.tagColor || 'blue'; 
                            const itemLink = item.link ? item.link : '#'; 
                            
                            const isExpired = item.isExpired === true;
                            const expiredClass = isExpired ? 'expired' : '';
                            const expiredTag = isExpired ? `<span class="tag-expired">已失效</span>` : '';

                            html += `
                                <a href="${itemLink}" class="list-item ${expiredClass}">
                                    <div class="date-box">
                                        <span class="date-day">${day}</span>
                                        <span class="date-ym">${yearMonth}</span>
                                    </div>
                                    <div class="content-box">
                                        <h3>${item.title} ${expiredTag}</h3>
                                        <p>${item.desc}</p>
                                    </div>
                                    <div class="action-box">
                                        <span class="tag-label ${tagClass}">${item.tag || '公告'}</span>
                                        <span class="arrow-icon">→</span>
                                    </div>
                                </a>
                            `;
                        });
                        html += `</div>`;
                    }

                    // 注入 DOM
                    container.innerHTML = html;

                    // 如果是首次加载，隐藏 loading 提示
                    if (isFirstLoad) {
                        loading.style.display = 'none';
                        isFirstLoad = false;
                    } else {
                        // 非首次加载（自动刷新），弹出 toast 提示
                        showToast();
                    }

                } catch (error) {
                    console.error('加载公告失败:', error);
                    if (isFirstLoad) {
                        loading.style.display = 'none';
                        container.innerHTML = `
                            <div class="empty-state" style="color: #ff6b6b; border-color: rgba(255,107,107,0.3);">
                                <strong>加载失败：</strong><br>
                                ${error.message} <br><br>
                                <span style="font-size: 12px; color: #a0aec0;">
                                    提示：请使用本地服务器环境（如 Live Server）运行，或部署到 Nginx/Apache。
                                </span>
                            </div>
                        `;
                    }
                }
            }

            // 弹出提示
            let toastTimer;
            function showToast() {
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            }

            // 初始化执行
            fetchAndRender();

            // 设置 30 秒定时器自动拉取
            setInterval(fetchAndRender, 30000);
        });
    </script>
</body>
</html>
